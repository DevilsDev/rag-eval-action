name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      library-ref:
        description: Branch or tag of rag-pipeline-utils to test against
        default: main

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Until rag-pipeline-utils 2.7.0 is on npm, the tests run against a
  # package built from its main branch. After the release, the jobs can
  # install the published version instead.
  library:
    name: Build rag-pipeline-utils
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          repository: DevilsDev/rag-pipeline-utils
          ref: ${{ inputs.library-ref || 'main' }}
          persist-credentials: false
      - uses: actions/setup-node@53b83947a5a98c8d113130e565377fae1a50d02f # v6.3.0
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - name: Pack
        run: |
          npm pack --ignore-scripts=false
          mv devilsdev-rag-pipeline-utils-*.tgz rag-pipeline-utils.tgz
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: library
          path: rag-pipeline-utils.tgz
          retention-days: 3

  passes:
    name: A clean run passes and comments
    needs: library
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: library
          path: ${{ runner.temp }}/library
      - name: Evaluate
        id: eval
        uses: ./
        with:
          working-directory: test/fixture
          ingest: docs
          dataset: tests.json
          min: |
            faithfulness=0.8
            sourceRecall=1
          name: self-test
          package: ${{ runner.temp }}/library/rag-pipeline-utils.tgz
      - name: Check the outputs
        env:
          PASSED: ${{ steps.eval.outputs.passed }}
          REPORT: ${{ steps.eval.outputs.report }}
          SUMMARY: ${{ steps.eval.outputs.summary }}
        run: |
          set -euo pipefail
          test "$PASSED" = "true"
          test -f "$REPORT"
          head -1 "$SUMMARY" | grep -qx '<!-- rag-eval:self-test -->'
          grep -q 'RAG evaluation: ✅ Passed' "$SUMMARY"
          node -e 'const r = require(process.argv[1]); if (r.summary.metrics.sourceRecall.mean !== 1) process.exit(1)' "$REPORT"

  regression:
    name: A worse run fails against its baseline
    needs: library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: library
          path: ${{ runner.temp }}/library
      - name: Baseline
        id: base
        uses: ./
        with:
          working-directory: test/fixture
          ingest: docs
          dataset: tests.json
          name: baseline
          comment: "false"
          package: ${{ runner.temp }}/library/rag-pipeline-utils.tgz
      - name: Worse answers
        id: worse
        uses: ./
        env:
          RAG_EVAL_TEST_ANSWER: The office is in Paris.
        with:
          working-directory: test/fixture
          dataset: tests.json
          baseline: ${{ steps.base.outputs.report }}
          name: worse
          comment: "false"
          fail: "false"
          package: ${{ runner.temp }}/library/rag-pipeline-utils.tgz
      - name: Check the outputs
        env:
          BASE_PASSED: ${{ steps.base.outputs.passed }}
          PASSED: ${{ steps.worse.outputs.passed }}
          COMPARED: ${{ steps.worse.outputs.compared }}
          SUMMARY: ${{ steps.worse.outputs.summary }}
        run: |
          set -euo pipefail
          test "$BASE_PASSED" = "true"
          test "$PASSED" = "false"
          test "$COMPARED" = "true"
          grep -q 'RAG evaluation: ❌ Failed' "$SUMMARY"
          grep -q 'Faithfulness dropped -1.000 from the baseline' "$SUMMARY"

  errors:
    name: A broken setup fails the step
    needs: library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: library
          path: ${{ runner.temp }}/library
      - name: Invalid dataset
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          working-directory: test/fixture
          ingest: docs
          dataset: invalid.json
          comment: "false"
          package: ${{ runner.temp }}/library/rag-pipeline-utils.tgz
      - name: Missing baseline file
        id: nobaseline
        continue-on-error: true
        uses: ./
        with:
          working-directory: test/fixture
          dataset: tests.json
          baseline: does-not-exist.json
          comment: "false"
          package: ${{ runner.temp }}/library/rag-pipeline-utils.tgz
      - name: Check both failed
        env:
          INVALID: ${{ steps.invalid.outcome }}
          NOBASELINE: ${{ steps.nobaseline.outcome }}
        run: |
          test "$INVALID" = "failure"
          test "$NOBASELINE" = "failure"
