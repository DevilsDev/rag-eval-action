name: Test

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: true

jobs:
  passes:
    name: A clean run passes and comments
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Evaluate
        id: eval
        uses: ./
        with:
          working-directory: test/fixture
          ingest: docs
          dataset: tests.json
          min: |
            faithfulness=0.8
            sourceRecall=1
          name: self-test
      - name: Check the outputs
        env:
          PASSED: ${{ steps.eval.outputs.passed }}
          REPORT: ${{ steps.eval.outputs.report }}
          SUMMARY: ${{ steps.eval.outputs.summary }}
        run: |
          set -euo pipefail
          test "$PASSED" = "true"
          test -f "$REPORT"
          head -1 "$SUMMARY" | grep -qx '<!-- rag-eval:self-test -->'
          grep -q 'RAG evaluation: ✅ Passed' "$SUMMARY"
          node -e 'const r = require(process.argv[1]); if (r.summary.metrics.sourceRecall.mean !== 1) process.exit(1)' "$REPORT"

  regression:
    name: A worse run fails against its baseline
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Baseline
        id: base
        uses: ./
        with:
          working-directory: test/fixture
          ingest: docs
          dataset: tests.json
          name: baseline
          comment: "false"
      - name: Worse answers
        id: worse
        uses: ./
        env:
          RAG_EVAL_TEST_ANSWER: The office is in Paris.
        with:
          working-directory: test/fixture
          dataset: tests.json
          baseline: ${{ steps.base.outputs.report }}
          name: worse
          comment: "false"
          fail: "false"
      - name: Check the outputs
        env:
          BASE_PASSED: ${{ steps.base.outputs.passed }}
          PASSED: ${{ steps.worse.outputs.passed }}
          COMPARED: ${{ steps.worse.outputs.compared }}
          SUMMARY: ${{ steps.worse.outputs.summary }}
        run: |
          set -euo pipefail
          test "$BASE_PASSED" = "true"
          test "$PASSED" = "false"
          test "$COMPARED" = "true"
          grep -q 'RAG evaluation: ❌ Failed' "$SUMMARY"
          grep -q 'Faithfulness dropped -1.000 from the baseline' "$SUMMARY"

  errors:
    name: A broken setup fails the step
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Invalid dataset
        id: invalid
        continue-on-error: true
        uses: ./
        with:
          working-directory: test/fixture
          ingest: docs
          dataset: invalid.json
          comment: "false"
      - name: Missing baseline file
        id: nobaseline
        continue-on-error: true
        uses: ./
        with:
          working-directory: test/fixture
          dataset: tests.json
          baseline: does-not-exist.json
          comment: "false"
      - name: Check both failed
        env:
          INVALID: ${{ steps.invalid.outcome }}
          NOBASELINE: ${{ steps.nobaseline.outcome }}
        run: |
          test "$INVALID" = "failure"
          test "$NOBASELINE" = "failure"

  peers:
    name: Optional peers the config needs are installed
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Detect peers from a config
        run: |
          set -euo pipefail
          test "$(node scripts/peers.js test/peers/openai.ragrc.json | tr '\n' ' ')" = "openai pg "
          test -z "$(node scripts/peers.js test/fixture/.ragrc.json)"
          test -z "$(node scripts/peers.js does-not-exist.json)"
      # No API key here, so the run itself fails; only the install matters.
      - name: Run with a config that uses openai
        continue-on-error: true
        uses: ./
        with:
          working-directory: test/peers
          config: openai.ragrc.json
          dataset: ../fixture/tests.json
          comment: "false"
      - name: Check openai and pg were installed next to the CLI
        run: |
          set -euo pipefail
          test -f "$RUNNER_TEMP/rag-eval-cli/node_modules/openai/package.json"
          test -f "$RUNNER_TEMP/rag-eval-cli/node_modules/pg/package.json"
